<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎓 MISIÓN ANTIMALWARE | Cybersecurity Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0B0E17 0%, #0a0f1a 100%); min-height: 100vh; padding: 20px; }
        .game-container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        .game-panel { background: rgba(15, 25, 45, 0.8); backdrop-filter: blur(10px); border-radius: 48px; padding: 20px; border: 2px solid rgba(0, 212, 255, 0.3); }
        .ranking-panel { background: rgba(15, 25, 45, 0.8); backdrop-filter: blur(10px); border-radius: 48px; padding: 20px; border: 2px solid rgba(168, 85, 247, 0.3); height: fit-content; }
        .ranking-title { font-size: 1.3rem; font-weight: 700; color: #FDE047; text-align: center; margin-bottom: 15px; }
        .ranking-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(0,0,0,0.3); margin: 8px 0; border-radius: 40px; }
        .ranking-score { color: #FDE047; font-weight: 800; }
        .login-area { background: rgba(0,0,0,0.4); border-radius: 32px; padding: 25px; text-align: center; }
        .login-area h2 { margin-bottom: 10px; background: linear-gradient(135deg, #FDE047, #A855F7); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .login-area input { width: 100%; background: #1E293B; border: 1px solid #334155; padding: 14px 20px; border-radius: 60px; color: white; font-size: 1rem; margin: 15px 0; }
        .login-area button, .next-btn { background: linear-gradient(90deg, #7B2CBF, #A855F7); border: none; padding: 14px 28px; border-radius: 60px; color: white; font-weight: bold; cursor: pointer; width: 100%; }
        .user-info { background: rgba(168, 85, 247, 0.2); border-radius: 32px; padding: 12px 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .btn-logout { background: #EF4444; border: none; padding: 5px 15px; border-radius: 40px; color: white; cursor: pointer; }
        .stats { display: flex; gap: 25px; background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 60px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .health-bar { width: 100px; height: 10px; background: #2D2F3E; border-radius: 20px; overflow: hidden; }
        .health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #10B981, #06B6D4); border-radius: 20px; transition: width 0.3s; }
        .level-badge { text-align: center; margin: 10px 0; }
        .level-badge span { background: #7B2CBF; padding: 4px 12px; border-radius: 50px; font-size: 0.8rem; }
        .malware-card { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 25px; }
        .malware-icon { font-size: 5rem; background: rgba(239,68,68,0.15); width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 60px; border: 2px solid #EF4444; }
        .malware-name { font-size: 1.8rem; font-weight: 800; color: #EF4444; }
        .malware-desc { font-size: 0.8rem; color: #94A3B8; }
        .question-text { font-size: 1.2rem; font-weight: 600; color: #FDE047; text-align: center; margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 20px; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin: 20px 0; }
        .option-btn { background: #1E293B; border: 2px solid #334155; border-radius: 60px; padding: 12px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: left; color: #E2E8F0; }
        .option-btn:hover:not(:disabled) { background: #2D3A5E; border-color: #A855F7; }
        .option-btn.correct { background: #10B981; border-color: #10B981; }
        .option-btn.incorrect { background: #EF4444; border-color: #EF4444; }
        .next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .game-overlay.show { visibility: visible; opacity: 1; }
        .game-over-card { background: linear-gradient(135deg, #1a1f2e, #0f1222); border-radius: 48px; padding: 2rem; text-align: center; max-width: 450px; border: 2px solid #A855F7; }
        .final-score { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #FDE047, #A855F7); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .status-text { margin-top: 20px; font-size: 0.7rem; text-align: center; color: #475569; }
        @media (max-width: 900px) { .game-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-panel">
        <div id="loginSection">
            <div class="login-area">
                <h2>🎮 Misión Antimalware</h2>
                <p style="color: #94A3B8; margin-bottom: 20px;">Demuestra lo que aprendiste y compite globalmente</p>
                <input type="text" id="playerName" placeholder="Ej: CiberGuardian07" maxlength="30">
                <button id="startGameBtn">🚀 Comenzar Misión</button>
                <p style="margin-top: 15px; font-size: 0.7rem; color: #475569;">Los puntajes se guardan en la nube</p>
            </div>
        </div>

        <div id="gameContent" style="display:none;">
            <div class="user-info">
                <span>👤 <strong id="displayName">---</strong></span>
                <span>🏆 Mejor puntaje: <strong id="personalBest">0</strong></span>
                <button id="logoutBtn" class="btn-logout">Salir</button>
            </div>
            <div class="stats">
                <div class="stat"><span>🎯 PUNTOS:</span> <span id="scoreValue">0</span></div>
                <div class="stat"><span>❤️ VIDAS:</span><div class="health-bar"><div class="health-fill" id="healthFill"></div></div></div>
                <div class="stat"><span>✅ ACIERTOS:</span> <span id="correctCount">0</span></div>
            </div>
            <div class="level-badge"><span id="levelText">🎯 NIVEL 1: MALWARE BÁSICO</span></div>
            <div id="challengeArea"></div>
            <button class="next-btn" id="nextBtn" disabled>▶ SIGUIENTE MALWARE</button>
        </div>
    </div>

    <div class="ranking-panel">
        <div class="ranking-title">🏆 RANKING GLOBAL 🏆</div>
        <div id="rankingList"><div style="text-align:center; padding:20px;">Cargando...</div></div>
        <div class="status-text" id="statusText">🔄 Conectando a Supabase...</div>
    </div>
</div>

<div class="game-overlay" id="gameOverlay">
    <div class="game-over-card">
        <h2>💀 MISIÓN FALLIDA 💀</h2>
        <div class="final-score" id="finalScoreDisplay">0</div>
        <p id="messageDisplay"></p>
        <button class="next-btn" id="playAgainBtn">🎮 JUGAR DE NUEVO</button>
    </div>
</div>

<script>
    // ============================================
    // CONFIGURACIÓN - CLAVE CORREGIDA
    // ============================================
    const SUPABASE_URL = 'https://kpywveceznobreogzjbg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtweXd2ZWNlem5vYnJlb2d6amJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTM1ODksImV4cCI6MjA5NjA4OTU4OX0._QPk3rigfRIw3QYGtNktlm6XN6MS4z_PewfY1GJffW0';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentPlayer = null;
    
    // Estado del juego
    let gameState = {
        malwaresPendientes: [],
        malwareActual: null,
        preguntaActual: null,
        respondido: false,
        puntaje: 0,
        vidas: 3,
        aciertos: 0,
        nivel: 1
    };
    
    // Base de datos de malware
    const MALWARE_DB = [
        { id: 1, name: "VIRUS", icon: "🦠", desc: "Se adjunta a archivos limpios y se propaga al ejecutarlos.", chars: ["Se pega a otros archivos", "Necesita intervención humana"], level: 1 },
        { id: 2, name: "TROYANO", icon: "🐴", desc: "Se disfraza de software legítimo para engañarte.", chars: ["Se disfraza de algo bueno", "Crea puertas traseras"], level: 1 },
        { id: 3, name: "RANSOMWARE", icon: "💰", desc: "Secuestra tus archivos y pide rescate económico.", chars: ["Encripta archivos", "Pide rescate"], level: 2 },
        { id: 4, name: "SPYWARE", icon: "👁️", desc: "Espía tus actividades sin que lo notes.", chars: ["Espía en secreto", "Roba contraseñas"], level: 1 },
        { id: 5, name: "GUSANO", icon: "🐛", desc: "Se replica automáticamente por la red.", chars: ["Se propaga solo", "No necesita archivo"], level: 2 },
        { id: 6, name: "KEYLOGGER", icon: "⌨️", desc: "Registra cada tecla que presionas.", chars: ["Graba tecleo", "Roba credenciales"], level: 2 },
        { id: 7, name: "ROOTKIT", icon: "🎭", desc: "Se oculta en niveles profundos del sistema.", chars: ["Se esconde del antivirus", "Opera a nivel kernel"], level: 3 },
        { id: 8, name: "ADWARE", icon: "📢", desc: "Muestra publicidad no deseada.", chars: ["Muestra anuncios", "Viene con software gratis"], level: 1 },
        { id: 9, name: "BOTNET", icon: "🤖", desc: "Red de dispositivos infectados controlados remotamente.", chars: ["Dispositivos esclavos", "Usado para DDoS"], level: 3 },
        { id: 10, name: "RAT", icon: "🎮", desc: "Permite control remoto total del dispositivo.", chars: ["Control total remoto", "Acceso a cámara"], level: 3 }
    ];
    
    function obtenerPregunta(malware) {
        const preguntas = [
            {
                texto: `¿Cuál es la principal característica del ${malware.name}?`,
                opciones: [malware.chars[0], malware.chars[1], "Es fácil de eliminar", "Solo afecta a Mac"],
                correcta: 0,
                explicacion: malware.desc
            },
            {
                texto: `¿Cómo se propaga típicamente el ${malware.name}?`,
                opciones: ["Por correo electrónico", "Infectando archivos", "Por redes sociales", malware.id === 5 ? "Se replica solo por la red" : "Requiere que el usuario lo ejecute"],
                correcta: malware.id === 5 ? 3 : 0,
                explicacion: malware.desc
            },
            {
                texto: `Si tu computadora tiene ${malware.name}, ¿qué señal notarías?`,
                opciones: [
                    malware.id === 3 ? "Tus archivos no se abren y piden rescate" : 
                    (malware.id === 4 ? "Tu PC está más lenta y hay programas raros" : "Aparecen ventanas emergentes"),
                    "La pantalla se ve más brillante",
                    "El internet es más rápido",
                    "Se instalan actualizaciones"
                ],
                correcta: 0,
                explicacion: malware.desc
            }
        ];
        return preguntas[malware.id % preguntas.length];
    }
    
    function mezclarArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
    
    // Funciones Supabase
    async function obtenerOCrearJugador(nombre) {
        const { data: existing, error } = await supabase
            .from('jugadores')
            .select('*')
            .eq('nombre', nombre)
            .maybeSingle();
        
        if (error) {
            console.error("Error búsqueda:", error);
            return { success: false, error: error };
        }
        
        if (existing) {
            return { success: true, player: existing, isNew: false };
        }
        
        const { data: newPlayer, error: insertError } = await supabase
            .from('jugadores')
            .insert({ nombre: nombre, puntaje_total: 0, partidas_jugadas: 0, aciertos_totales: 0 })
            .select()
            .single();
        
        if (insertError) {
            console.error("Error creación:", insertError);
            return { success: false, error: insertError };
        }
        
        return { success: true, player: newPlayer, isNew: true };
    }
    
    async function obtenerMejorPuntaje(jugadorId) {
        const { data, error } = await supabase
            .from('partidas')
            .select('puntaje')
            .eq('jugador_id', jugadorId)
            .order('puntaje', { ascending: false })
            .limit(1);
        
        if (error || !data || data.length === 0) return 0;
        return data[0].puntaje;
    }
    
    async function guardarPartida(jugadorId, puntaje, nivel, correctas, incorrectas) {
        const { error } = await supabase
            .from('partidas')
            .insert({
                jugador_id: jugadorId,
                puntaje: puntaje,
                nivel_alcanzado: nivel,
                respuestas_correctas: correctas,
                respuestas_incorrectas: incorrectas
            });
        
        if (error) console.error("Error guardando partida:", error);
        
        const { data: existing } = await supabase
            .from('jugadores')
            .select('puntaje_total, partidas_jugadas, aciertos_totales')
            .eq('id', jugadorId)
            .single();
        
        if (existing) {
            await supabase
                .from('jugadores')
                .update({
                    puntaje_total: (existing.puntaje_total || 0) + puntaje,
                    partidas_jugadas: (existing.partidas_jugadas || 0) + 1,
                    aciertos_totales: (existing.aciertos_totales || 0) + correctas
                })
                .eq('id', jugadorId);
        }
    }
    
    async function cargarRanking() {
        const { data, error } = await supabase
            .from('jugadores')
            .select('nombre, puntaje_total')
            .order('puntaje_total', { ascending: false })
            .limit(10);
        
        const rankingDiv = document.getElementById('rankingList');
        
        if (error || !data || data.length === 0) {
            rankingDiv.innerHTML = '<div style="text-align:center; padding:20px;">Sin jugadores aún. ¡Sé el primero!</div>';
            return;
        }
        
        rankingDiv.innerHTML = data.map((j, idx) => `
            <div class="ranking-item">
                <div class="ranking-name">${idx === 0 ? '🏆' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '📌'} ${j.nombre.substring(0, 20)}</div>
                <div class="ranking-score">${j.puntaje_total} pts</div>
            </div>
        `).join('');
    }
    
    // Lógica del juego
    function actualizarUI() {
        document.getElementById('scoreValue').textContent = gameState.puntaje;
        document.getElementById('correctCount').textContent = gameState.aciertos;
        const healthPercent = (gameState.vidas / 3) * 100;
        const healthFill = document.getElementById('healthFill');
        healthFill.style.width = `${healthPercent}%`;
        if (healthPercent < 30) healthFill.style.background = "linear-gradient(90deg, #EF4444, #F97316)";
        else healthFill.style.background = "linear-gradient(90deg, #10B981, #06B6D4)";
        
        let nivel = 1;
        if (gameState.puntaje >= 500) nivel = 3;
        else if (gameState.puntaje >= 200) nivel = 2;
        gameState.nivel = nivel;
        const niveles = {1: "MALWARE BÁSICO", 2: "MALWARE PELIGROSO", 3: "AMENAZAS AVANZADAS"};
        document.getElementById('levelText').innerHTML = `🎯 NIVEL ${nivel}: ${niveles[nivel]}`;
    }
    
    function cargarSiguienteMalware() {
        if (gameState.malwaresPendientes.length === 0) {
            finalizarJuego(true);
            return;
        }
        
        gameState.malwareActual = gameState.malwaresPendientes.shift();
        gameState.preguntaActual = obtenerPregunta(gameState.malwareActual);
        gameState.respondido = false;
        
        renderizarPregunta();
        document.getElementById('nextBtn').disabled = true;
    }
    
    function renderizarPregunta() {
        const m = gameState.malwareActual;
        const q = gameState.preguntaActual;
        
        document.getElementById('challengeArea').innerHTML = `
            <div class="malware-card">
                <div class="malware-icon">${m.icon}</div>
                <div class="malware-name">${m.name}</div>
                <div class="malware-desc">${m.desc}</div>
            </div>
            <div class="question-text">❓ ${q.texto}</div>
            <div class="options-grid" id="optionsGrid">
                ${q.opciones.map((opt, idx) => `<button class="option-btn" data-idx="${idx}">${String.fromCharCode(65+idx)}. ${opt}</button>`).join('')}
            </div>
            <div id="feedbackArea" style="display:none;"></div>
        `;
        
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!gameState.respondido) procesarRespuesta(parseInt(btn.dataset.idx));
            });
        });
    }
    
    function procesarRespuesta(seleccion) {
        gameState.respondido = true;
        const esCorrecta = (seleccion === gameState.preguntaActual.correcta);
        const feedbackDiv = document.getElementById('feedbackArea');
        feedbackDiv.style.display = 'block';
        
        if (esCorrecta) {
            const puntos = 10 * gameState.malwareActual.level;
            gameState.puntaje += puntos;
            gameState.aciertos++;
            feedbackDiv.innerHTML = `<div style="padding:15px; border-left:4px solid #10B981; background:rgba(16,185,129,0.1); border-radius:16px;">
                ✅ <strong>¡CORRECTO!</strong> +${puntos} puntos<br>📚 ${gameState.preguntaActual.explicacion}
            </div>`;
        } else {
            gameState.vidas--;
            feedbackDiv.innerHTML = `<div style="padding:15px; border-left:4px solid #EF4444; background:rgba(239,68,68,0.1); border-radius:16px;">
                ❌ <strong>INCORRECTO</strong> -1 vida<br>📚 Respuesta correcta: ${gameState.preguntaActual.opciones[gameState.preguntaActual.correcta]}<br>💡 ${gameState.malwareActual.desc}
            </div>`;
        }
        
        document.querySelectorAll('.option-btn').forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === gameState.preguntaActual.correcta) btn.classList.add('correct');
            if (idx === seleccion && idx !== gameState.preguntaActual.correcta) btn.classList.add('incorrect');
        });
        
        actualizarUI();
        
        if (gameState.vidas <= 0) {
            finalizarJuego(false);
        } else {
            document.getElementById('nextBtn').disabled = false;
        }
    }
    
    async function finalizarJuego(victoria) {
        if (currentPlayer) {
            const incorrectas = (gameState.aciertos + (3 - gameState.vidas)) - gameState.aciertos;
            await guardarPartida(currentPlayer.id, gameState.puntaje, gameState.nivel, gameState.aciertos, incorrectas);
            const best = await obtenerMejorPuntaje(currentPlayer.id);
            document.getElementById('personalBest').textContent = best;
            await cargarRanking();
        }
        
        const finalScore = document.getElementById('finalScoreDisplay');
        const messageDisplay = document.getElementById('messageDisplay');
        finalScore.textContent = gameState.puntaje;
        
        let mensaje = "";
        if (victoria) {
            mensaje = "🎉 ¡MISIÓN COMPLETADA! Has identificado todos los malwares. ¡Eres un guardián de la ciberseguridad! 🎉";
        } else if (gameState.puntaje >= 300) {
            mensaje = "🏆 ¡ASOMBROSO! Eres un experto en malware. 🏆";
        } else if (gameState.puntaje >= 150) {
            mensaje = "🛡️ ¡Muy bien! Repasa los tipos de nivel 2 y 3.";
        } else {
            mensaje = "💪 No te rindas. Estudia los tipos de malware y vuélvelo a intentar.";
        }
        messageDisplay.textContent = mensaje;
        document.getElementById('gameOverlay').classList.add('show');
    }
    
    function iniciarNuevaPartida() {
        gameState.malwaresPendientes = mezclarArray([...MALWARE_DB]);
        gameState.puntaje = 0;
        gameState.vidas = 3;
        gameState.aciertos = 0;
        gameState.respondido = false;
        gameState.nivel = 1;
        
        actualizarUI();
        document.getElementById('gameOverlay').classList.remove('show');
        cargarSiguienteMalware();
    }
    
    // Eventos y login
    async function iniciarSesion() {
        const nombre = document.getElementById('playerName').value.trim();
        if (!nombre) { alert("Ingresa un nombre"); return; }
        if (nombre.length < 3) { alert("El nombre debe tener al menos 3 caracteres"); return; }
        
        const result = await obtenerOCrearJugador(nombre);
        if (!result.success) {
            alert("Error: " + (result.error?.message || "No se pudo conectar"));
            return;
        }
        
        currentPlayer = result.player;
        document.getElementById('displayName').textContent = currentPlayer.nombre;
        const best = await obtenerMejorPuntaje(currentPlayer.id);
        document.getElementById('personalBest').textContent = best;
        
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('gameContent').style.display = 'block';
        
        iniciarNuevaPartida();
        cargarRanking();
    }
    
    function cerrarSesion() {
        currentPlayer = null;
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('gameContent').style.display = 'none';
        document.getElementById('playerName').value = '';
    }
    
    // Probar conexión al cargar
    async function testConexion() {
        const statusDiv = document.getElementById('statusText');
        const { error } = await supabase.from('jugadores').select('count', { count: 'exact', head: true });
        
        if (error) {
            statusDiv.innerHTML = `❌ Error: ${error.message.substring(0, 60)}`;
            console.error("Conexión fallida:", error);
        } else {
            statusDiv.innerHTML = '✅ Conectado a Supabase';
            console.log("Conexión exitosa!");
            await cargarRanking();
        }
    }
    
    // Event listeners
    document.getElementById('startGameBtn').addEventListener('click', iniciarSesion);
    document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
    document.getElementById('nextBtn').addEventListener('click', () => {
        if (gameState.respondido && gameState.vidas > 0) cargarSiguienteMalware();
    });
    document.getElementById('playAgainBtn').addEventListener('click', () => {
        iniciarNuevaPartida();
    });
    document.getElementById('playerName').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') iniciarSesion();
    });
    
    // Iniciar
    testConexion();
</script>
</body>
</html>
